# DXVK settings for the games in this folder, loaded through game-env.sh

# Queue a single frame so the pads feel direct
dxgi.maxFrameLatency = 1
d3d9.maxFrameLatency = 1

# The panel runs at 60 Hz during the game, so vsync alone paces the frames.
# A second limiter on top of vsync causes uneven frame times.
dxgi.syncInterval = 1
dxgi.maxFrameRate = -1
d3d9.presentInterval = 1
