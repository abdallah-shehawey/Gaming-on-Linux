<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gaming on Linux · Setup video</title>
<meta name="description" content="Play any Windows game on Linux from your Steam library, with all your controllers. Setup video, 7:46, in Egyptian Arabic.">
<meta property="og:title" content="Gaming on Linux · Setup video">
<meta property="og:image" content="poster.jpg">
<style>
  :root { --bg:#0e1622; --panel:#171d25; --text:#e6edf3; --muted:#8f98a0; --accent:#66c0f4; --line:#2a3542; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 "Inter", "Segoe UI", system-ui, -apple-system, sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 28px 16px 40px; }
  h1 { font-size: 26px; margin: 0 0 4px; letter-spacing: -.01em; }
  h1 span { color: var(--accent); }
  p.sub { margin: 0 0 18px; color: var(--muted); }
  .player { background: #000; border: 1px solid var(--line); border-radius: 10px; overflow: hidden;
    box-shadow: 0 10px 40px rgba(0,0,0,.45); }
  video { display: block; width: 100%; height: auto; aspect-ratio: 16 / 9; background: #000; }
  nav { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
  a.btn { display: inline-block; padding: 9px 16px; border-radius: 6px; text-decoration: none;
    color: var(--text); background: var(--panel); border: 1px solid var(--line); font-weight: 600; }
  a.btn.primary { background: linear-gradient(90deg, #47bfff, #1a44c2); border-color: transparent; color: #fff; }
  a.btn:hover { filter: brightness(1.12); }
</style>
</head>
<body>
<main>
  <h1>Gaming on <span>Linux</span></h1>
  <p class="sub">Windows games on Linux, from your Steam library, with all your controllers. Setup video, 7:46, in Egyptian Arabic.</p>
  <div class="player">
    <video controls playsinline preload="metadata" poster="poster.jpg" src="video.mp4"></video>
  </div>
  <nav>
    <a class="btn primary" href="https://github.com/abdallah-shehawey/Gaming-on-Linux">Get the scripts on GitHub</a>
    <a class="btn" href="video.mp4" download="How to Play - Setup Guide.mp4">Download the video (96 MB)</a>
  </nav>
</main>
</body>
</html>
